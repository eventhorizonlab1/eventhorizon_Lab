name: Security audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'Onesiker/package.json'
      - 'Onesiker/package-lock.json'
      - '.github/workflows/security-audit.yml'
  schedule:
    # Lundi 05:30 UTC = 06:30 Europe/Paris (juste avant Dependabot)
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (production deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Onesiker
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Onesiker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        if: always()
        run: npm audit --audit-level=moderate || true
